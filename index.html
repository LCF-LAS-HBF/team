<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2340">
<title>Liaison Asset Services</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.45; color: #0f2340; background: #ffffff;
    -webkit-text-size-adjust: 100%;
  }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; font-weight: 400; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #c9a227; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; }

  .bar { background: #ffffff; border-bottom: 2px solid #c9a227; position: sticky; top: 0; z-index: 5; }
  .bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px 8px; min-height: 64px; }
  .bar img { height: 46px; width: auto; display: block; }
  .bar .right { display: flex; gap: 8px; align-items: center; }
  .chip { font-size: 14px; font-weight: 600; background: #ffffff; border: 1.5px solid #0f2340; border-radius: 20px; padding: 7px 14px; min-height: 38px; }
  .back { font-size: 15px; font-weight: 600; background: none; border: 0; padding: 14px 0 6px; display: inline-block; }

  .center { text-align: center; padding: 44px 26px 56px; }
  .center img { width: 230px; max-width: 70%; height: auto; display: block; margin: 0 auto 26px; }
  .center h1 { font-size: 26px; margin: 0 0 10px; }
  .center p { font-size: 16px; color: #51606e; margin: 0 0 10px; }
  .pin {
    width: 100%; max-width: 260px; margin: 18px auto 10px; display: block; font: inherit; font-size: 30px; letter-spacing: 10px;
    text-align: center; padding: 12px 8px; color: inherit; background: #ffffff; border: 2px solid #7d8a97; border-radius: 10px;
  }
  .check { display: flex; gap: 10px; align-items: center; justify-content: center; font-size: 15px; color: #51606e; margin: 14px 0 6px; }
  .check input { width: 20px; height: 20px; accent-color: #0f2340; }

  .hero { background: #0f2340; color: #ffffff; border-bottom: 3px solid #c9a227; }
  .hero .wrap { padding: 22px 16px 20px; }
  .hero .level { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #e6c861; }
  .hero h1 { font-size: 32px; line-height: 1.12; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .hero .loc { font-size: 15px; color: #d5dbe6; }

  .pad { padding: 16px 16px 44px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 20px; padding: 6px 14px; font-size: 15px; font-weight: 700; border: 1.5px solid; }
  .pill i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; display: inline-block; }
  .pill.s { color: #1c6b3c; } .pill.a { color: #8a5a00; background: #fff8e1; } .pill.r { color: #a8320a; background: #ffece4; }
  .live { font-size: 13px; color: #51606e; margin: 10px 0 14px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .live b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c9a227; margin-right: 7px; }
  .link { background: none; border: 0; padding: 0; font-size: inherit; text-decoration: underline; color: #0f2340; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: #eef1f5; border: 2px solid #eef1f5; border-radius: 12px; padding: 12px 12px 11px; text-align: left; min-height: 74px; display: block; width: 100%; }
  .tile small { display: block; font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: #51606e; font-weight: 700; margin-bottom: 4px; }
  .tile span { display: block; font-size: 18px; font-weight: 700; line-height: 1.25; }
  .tile.you { background: #ffffff; border-color: #c9a227; }
  .tile.wide { grid-column: 1 / -1; }
  .hint { font-size: 13px; color: #51606e; margin: 10px 0 0; }

  .sec { margin-top: 24px; }
  .sec h2 { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; margin: 0 0 8px; padding-bottom: 7px; border-bottom: 1.5px solid #c9a227; }
  .sec p { margin: 0; font-size: 16px; }
  h1.title { font-size: 26px; line-height: 1.15; margin: 4px 0 2px; }
  .sub { font-size: 14px; color: #51606e; margin: 0 0 6px; }

  .card { border: 1.5px solid #c9a227; border-radius: 12px; padding: 14px; margin-top: 10px; background: #ffffff; }
  .card .t { font-weight: 700; font-size: 17px; }
  .card .r { font-size: 14px; color: #51606e; margin: 4px 0 8px; }
  .amt { font-size: 21px; font-weight: 700; }
  .btn { display: block; width: 100%; text-align: center; border-radius: 10px; padding: 14px 12px; font-size: 16px; font-weight: 700; margin-top: 10px; min-height: 50px; border: 1.5px solid #0f2340; background: #ffffff; color: #0f2340; text-decoration: none; }
  .btn.navy { background: #0f2340; color: #ffffff; }
  .btn:disabled { opacity: .55; }

  .rows button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 2px; border: 0; border-bottom: 1px solid #d5dbe1; background: none; font-size: 16px; font-weight: 600; text-align: left; }
  .rows button span { color: #51606e; font-weight: 400; font-size: 14px; white-space: nowrap; }

  .item { border-bottom: 1px solid #d5dbe1; padding: 14px 0; }
  .item:last-child { border-bottom: 0; }
  .item .h { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .item .h a { color: #0f2340; }
  .item .m { font-size: 13.5px; color: #51606e; margin: 3px 0 8px; }
  .tag { display: inline-block; font-size: 12.5px; font-weight: 700; border-radius: 12px; padding: 3px 10px; background: #eef1f5; color: #0f2340; margin: 0 6px 4px 0; }
  .tag.w { background: #fff1c9; color: #6b4e00; } .tag.g { background: #e3f3e6; color: #1c6b3c; } .tag.r { background: #ffe1d6; color: #7a1d00; }
  .note { background: #eef1f5; border-left: 3px solid #c9a227; border-radius: 6px; padding: 9px 11px; font-size: 14.5px; margin-top: 8px; overflow-wrap: anywhere; }
  .note b { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: #51606e; display: block; font-weight: 700; }
  .more { font-size: 14px; margin-top: 8px; }
  .more a, .more button { color: #0f2340; }

  .kv b { display: block; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: #51606e; margin-top: 14px; font-weight: 700; }
  .kv div { font-size: 16px; overflow-wrap: anywhere; }
  .box { border-radius: 8px; padding: 12px 14px; font-size: 15px; margin-top: 14px; }
  .box.good { background: #e3f3e6; border-left: 5px solid #1c6b3c; }
  .box.warn { background: #fff1c9; border-left: 5px solid #c9a227; }
  .box.bad { background: #ffe1d6; border-left: 5px solid #a8320a; color: #7a1d00; font-weight: 600; }
  textarea { width: 100%; font: inherit; padding: 11px; min-height: 76px; resize: vertical; color: inherit; background: #ffffff; border: 2px solid #7d8a97; border-radius: 10px; margin-top: 6px; }
  label.l { display: block; font-weight: 600; font-size: 15px; margin-top: 16px; }
  .f { width: 100%; font: inherit; padding: 11px; color: inherit; background: #ffffff; border: 2px solid #7d8a97; border-radius: 10px; margin-top: 6px; min-height: 48px; }
  .f.bad, textarea.bad { border-color: #a8320a; background: #fff6f2; }
  .tick { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; margin-top: 18px; }
  .tick input { width: 24px; height: 24px; flex: none; margin-top: 1px; accent-color: #0f2340; }
  .qh { font-size: 13px; color: #51606e; margin-top: 4px; }

  table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 4px; }
  table.t th { text-align: left; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: #51606e; padding: 6px 4px; border-bottom: 1px solid #d5dbe1; font-weight: 700; }
  table.t td { padding: 8px 4px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
  .bal { font-size: 24px; font-weight: 700; }
  .foot { margin-top: 28px; font-size: 13px; color: #51606e; text-align: center; }
  .hq { border: 1.5px solid #d5dbe1; border-radius: 12px; margin-top: 10px; overflow: hidden; }
  .hq.open { border-color: #0f2340; }
  .hq > button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; background: #ffffff; border: 0; text-align: left; font-size: 16px; font-weight: 700; min-height: 52px; }
  .hq.open > button { background: #eef1f5; }
  .hq > button span { flex: none; color: #51606e; font-weight: 400; font-size: 18px; }
  .hq.open > button span { transform: rotate(90deg); }
  .hq .ha { padding: 2px 14px 16px; border-top: 1px solid #d5dbe1; }
  .hq .ha b { display: block; margin-top: 13px; font-size: 15.5px; }
  .hq .ha p { margin: 2px 0 0; font-size: 15.5px; overflow-wrap: anywhere; }
  .hq .ha p.p { margin-top: 13px; }
  .empty { color: #51606e; font-size: 15px; padding: 10px 0; }
</style>
</head>

    en: [
      ["Property Portfolio", "The organized record of your property: what it is, its systems, what has happened, what was paid, and the documents that prove it."],
      ["Property stable, Needs attention, Immediate action", "Our overall reading of the property today. Stable: nothing needs you. Needs attention: something is being worked on. Immediate action: something cannot wait."],

      ["Owner decision", "Something only you can decide. You can approve it, defer it, ask for another option, or ask us to call you first."],
      ["Repair", "Routine upkeep that keeps the home working as it is, such as fixing a leak or replacing a failed part. One repair has two visits: a first look and a close-out."],

      ["Additional visit", "A visit outside the ones included in your plan. It is billed by the hour, plus a flat travel charge for where the property is."],

  function post(body, onAnswer, onFail) {
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, 45000);
    var opts = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow" };
    if (ctrl) { opts.signal = ctrl.signal; }
    fetch(API, opts)
      .then(function (r) { return r.text(); })
      .then(function (text) {
        clearTimeout(timer);
        try { return JSON.parse(text); } catch (e) { return { ok: false, code: "SERVER" }; }
      }, function () { clearTimeout(timer); return null; })
      .then(function (j) { if (j === null) { onFail(); } else { onAnswer(j); } })
      .then(null, function (err) {
        // The answer arrived but the page could not draw it. Say so plainly instead of blaming the signal.
        try { console.error(err); } catch (e) {}
        S.busy = false; S.view = "error"; S.msg = { key: "SERVER", retry: S.tok ? load : hello };
        try { render(); } catch (e2) {}
      });
  }

    if (code === "OFF") { S.view = "off"; render(); return; }
    if (code === "SIGN_IN") { dropStore("tok"); S.tok = ""; S.data = null; S.view = "pin"; S.msg = null; render(); focusPin(); return; }
    if (code === "NOT_READY") { S.view = "error"; S.msg = { key: "NOT_READY", retry: load }; render(); return; }
    S.view = "error"; S.msg = { key: T.en[code] ? code : "SERVER", retry: S.tok ? load : hello }; render();
  }

  function load(quiet) {
    if (quiet !== true) { S.view = "loading"; S.msg = null; render(); }
    post({ op: "data", k: S.key, tok: S.tok, lang: S.lang }, function (r) {
      take(r);
      if (!r.ok) { stop(r.code); return; }
      if (quiet !== true || S.view === "loading") { S.view = "home"; S.arg = null; }
      render();
    }, function () {
      if (quiet === true && S.data) { return; }
      S.view = "error"; S.msg = { key: "NET", retry: load }; render();
    });
  }

  function signIn() {
    if (S.busy) { return; }
    var n = S.info.pinLen || 6;
    var raw = String(el("pin").value || "").replace(/[^0-9]/g, "");
    if (raw.length !== n) { return; }
    var keep = !!el("keep").checked;
    S.busy = true; S.msg = null; render();
    post({ op: "signin", k: S.key, pin: raw, keep: keep, lang: S.lang }, function (r) {
      S.busy = false;
      take(r);
      if (r.ok) {
        S.tok = r.tok;
        setStore("tok", r.tok, keep); setStore("k", S.key, keep);
        S.view = "home"; S.arg = null; S.msg = null;
        try { window.history.replaceState({ view: "home" }, "", window.location.pathname); } catch (e) {}
        render(); window.scrollTo(0, 0);
        return;
      }
      if (r.code === "BAD_PIN") { S.msg = { key: "BAD_PIN", vars: { n: r.left } }; S.view = "pin"; render(); focusPin(); return; }
      if (r.code === "PAUSED") { S.msg = { key: "PAUSED", vars: { m: r.wait } }; S.view = "pin"; render(); return; }
      stop(r.code);
    }, function () { S.busy = false; S.msg = { key: "NET" }; S.view = "pin"; render(); });
  }

  function focusPin() { var p = el("pin"); if (p) { try { p.focus(); } catch (e) {} } }

  function newId() {
    var s = "", abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
    for (var i = 0; i < 20; i++) { s += abc.charAt(Math.floor(Math.random() * abc.length)); }
    return s;
  }

  function sendDecision() {
    if (S.busy || !S.arg) { return; }
    var d = findDecision(S.arg.id);
    if (!d) { go("home"); return; }
    if (!S.arg.rid) { S.arg.rid = newId(); }
    var note = String((el("note") && el("note").value) || "").trim();
    S.arg.note = note;
    S.busy = true; S.msg = null; render();
    post({
      op: "decide", k: S.key, tok: S.tok, lang: S.lang, id: d.id, choice: S.arg.choice,
      amount: d.amount === undefined ? null : d.amount, cur: d.cur || "", note: note, rid: S.arg.rid
    }, function (r) {
      S.busy = false;
      take(r);
      if (r.ok && r.done) {
        // Step back from the confirmation to the decision, which now shows what was recorded.
        S.done = r.done; S.fresh = r.done.id;
        stepBack();
        return;
      }
      if (r.code === "SIGN_IN" || r.code === "NO_LINK" || r.code === "OFF") { stop(r.code); return; }
      if (!r.view) { S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad" }; render(); return; }
      S.flash = { key: T.en[r.code] ? r.code : "SERVER", kind: (r.code === "ALREADY") ? "warn" : "bad" };
      stepBack();
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }

  /* ---------- moving between screens ---------- */

  function go(view, arg) {
    S.view = view; S.arg = arg || null; S.msg = null; S.badFields = []; S.draft = {};
    try { window.history.pushState({ view: view, arg: arg || null }, "", window.location.pathname); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", function (ev) {
    if (!S.data || !S.tok) { return; }
    var st = ev.state || { view: "home" };
    S.view = st.view || "home"; S.arg = st.arg || null; S.msg = S.flash || null; S.flash = null;
    S.badFields = []; S.draft = {};
    render(); window.scrollTo(0, 0);
  });
  // One step back in the phone's own history, so its back button never returns to a finished form.
  function stepBack() {
    try { window.history.back(); } catch (e) { S.view = "home"; S.arg = null; S.msg = S.flash || null; S.flash = null; render(); }
  }

  function findDecision(id) {
    var L = (S.data && S.data.decisions) || [];
    for (var i = 0; i < L.length; i++) { if (same(L[i].id, id)) { return L[i]; } }
    return null;
  }

  /* ---------- drawing ---------- */

  function render() {
    document.documentElement.lang = S.lang;
    el("lang").textContent = t("other");
    var bare = S.view === "private" || S.view === "off" || S.view === "pin" || S.view === "loading" || S.view === "error";
    el("bar").hidden = bare;
    var h = "";
    if (S.view === "loading") { h = centered("", "<p>" + esc(t("loading")) + "</p>"); }
    else if (S.view === "private") { h = centered(T.en.privTitle, "<p>" + esc(T.en.privText) + "</p><p>" + esc(T.es.privText) + "</p>"); }
    else if (S.view === "off") { h = centered("", "<p>" + esc(T.en.offText) + "</p><p>" + esc(T.es.offText) + "</p>" + waButton()); }
    else if (S.view === "error") {
      h = centered("", "<p>" + esc(t(S.msg.key)) + "</p><button type='button' class='btn navy' data-act='retry'>" + esc(t("retry")) + "</button>" +
        (S.msg.key === "NOT_READY" ? waButton() : ""));
    }
    else if (S.view === "pin") { h = pinView(); }
    else if (!S.data) { h = centered("", "<p>" + esc(t("loading")) + "</p>"); }
    else if (S.view === "home") { h = homeView(); }
    else if (S.view === "decision") { h = decisionView(); }
    else if (S.view === "confirm") { h = confirmView(); }
    else if (S.view === "paid") { h = paidView(); }
    else if (S.view === "bills") { h = billsView(); }
    else if (S.view === "intake" && S.data.intake) { h = intakeView(); }
    else if (S.view === "intakeSec" && S.data.intake) { h = intakeSecView(); }
    else { h = listView(); }
    el("app").innerHTML = h;
    document.title = (S.data && !bare ? S.data.prop.name + " - " : "") + (S.info.biz || "Liaison Asset Services");
  }

  function centered(title, inner) {
    return "<div class='wrap center'><img src='" + LOGO + "' alt='Liaison Asset Services'>" +
      (title ? "<h1 class='serif'>" + esc(title) + "</h1>" : "") + inner + "</div>";
  }

  function waButton() {
    var n = String(S.info.wa || "").replace(/[^0-9]/g, "");
    if (!n) { return ""; }
    return "<a class='btn' href='https://wa.me/" + n + "' target='_blank' rel='noopener noreferrer'>" + esc(t("wa")) + "</a>";
  }

  function msgBox() {
    if (!S.msg) { return ""; }
    return "<div class='box " + (S.msg.kind || "bad") + "' role='alert'>" + esc(t(S.msg.key, S.msg.vars)) + "</div>";
  }

  function pinView() {
    var n = S.info.pinLen || 6, d = S.info.keepDays || 30;
    var paused = S.msg && S.msg.key === "PAUSED";
    return "<div class='wrap center'><img src='" + LOGO + "' alt='Liaison Asset Services'>" +
      "<h1 class='serif'>" + esc(t("welcome")) + "</h1><p><label for='pin'>" + esc(t("pinAsk", { n: n })) + "</label></p>" +
      "<input class='pin' id='pin' type='password' inputmode='numeric' autocomplete='off' maxlength='" + n + "'" + (S.busy || paused ? " disabled" : "") + ">" +
      "<label class='check'><input type='checkbox' id='keep' checked> " + esc(t("keep", { d: d })) + "</label>" +
      msgBox() +
      "<button type='button' class='btn navy' data-act='signin'" + (S.busy || paused ? " disabled" : "") + ">" + esc(S.busy ? t("loading") : t("go")) + "</button>" +
      "<p style='margin-top:22px'><button type='button' class='link' data-act='lang'>" + esc(t("other")) + "</button></p></div>";
  }

  function pill(status) {
    var s = String(status || "");
    if (!s) { return ""; }
    var cls = "s", key = "st_Stable";
    if (s === "Attention") { cls = "a"; key = "st_Attention"; }
    else if (s === "Immediate Action") { cls = "r"; key = "st_Immediate"; }
    else if (s !== "Stable") { return "<span class='pill a'><i></i>" + esc(tx(s)) + "</span>"; }
    return "<span class='pill " + cls + "'><i></i>" + esc(t(key)) + "</span>";
  }

  function tile(label, value, goTo, cls) {
    return "<button type='button' class='tile " + (cls || "") + "' data-go='" + goTo + "'><small>" + esc(label) + "</small><span>" + value + "</span></button>";
  }

  function hero() {
    var p = S.data.prop;
    return "<section class='hero'><div class='wrap'>" + (p.level ? "<div class='level'>" + esc(p.level) + "</div>" : "") +
      "<h1 class='serif'>" + esc(p.name) + "</h1>" + (p.loc ? "<div class='loc'>" + esc(p.loc) + "</div>" : "") + "</div></section>";
  }

  // Bills the owner pays directly and that are not paid yet.
  function ownerBills() {
    var L = (S.data && S.data.ledger) || [], out = [];
    for (var i = 0; i < L.length; i++) {
      if (L[i].bill && !L[i].isPaid && !L[i].fromWallet && String(L[i].method || "").toLowerCase() === "owner direct") { out.push(L[i]); }
    }
    return out;
  }
  function waitingDecisions() {
    var L = (S.data && S.data.decisions) || [], out = [];
    for (var i = 0; i < L.length; i++) { if (L[i].waiting) { out.push(L[i]); } }
    return out;
  }

  // Seasonal Hold, Owner-in-Residence or Service interruption, said plainly with its dates.
  function modeBox() {
    var p = S.data.prop;
    if (!p.mode || !T.en["mode_" + p.mode]) { return ""; }
    var when = "";
    if (p.modeFrom && p.modeUntil) { when = t("sinceUntil", { a: day(p.modeFrom), b: day(p.modeUntil) }); }
    else if (p.modeFrom) { when = t("since", { d: day(p.modeFrom) }); }
    else if (p.modeUntil) { when = t("until", { d: day(p.modeUntil) }); }
    return "<div class='box warn' style='margin:0 0 14px'><b>" + esc(t("mode_" + p.mode)) + "</b>" + (when ? " · " + esc(when) : "") + "<br>" + esc(t("modeP_" + p.mode)) + "</div>";
  }

  function visitsLine() {
    var V = S.data.visits;
    if (!V) { return ""; }
    return "<p class='hint'>" + esc(t("visitsLine", { a: day(V.from), b: day(V.to), u: V.used, n: V.included })) + "</p>";
  }

  function projectKey(pj) { return pj.id || ("row" + pj.row); }
  function findProject(key) {
    var L = (S.data && S.data.projects) || [];
    for (var i = 0; i < L.length; i++) { if (same(projectKey(L[i]), key)) { return L[i]; } }
    return null;
  }
  function projectProgress(pj) {
    var out = [];
    if (pj.days !== undefined) {
      if (!pj.active) { out.push(t("pRan", { d: pj.days })); }
      else if (pj.limitDays) { out.push(t("pDays", { d: pj.days, n: pj.limitDays })); }
      else { out.push(t("pDaysOpen", { d: pj.days })); }
    }
    if (pj.checksIncluded !== undefined) { out.push(t("pChecks", { u: pj.checksUsed || 0, n: pj.checksIncluded })); }
    return out;
  }
  function projectCard(pj) {
    var prog = projectProgress(pj);
    return "<div class='card'><div class='t'>" + esc(tx(pj.name)) + "</div>" +
      "<div style='margin-top:6px'>" + statusTag(pj.status) + (pj.level ? "<span class='tag'>" + esc(tx(pj.level)) + "</span>" : "") + "</div>" +
      (prog.length ? "<div class='r'>" + esc(prog.join(" · ")) + "</div>" : "") +
      noteBox(t("pUpdate"), pj.update) +
      "<button type='button' class='btn' data-go='project' data-arg='" + esc(projectKey(pj)) + "'>" + esc(t("viewProject")) + "</button></div>";
  }
  function projectCards(activeOnly) {
    var L = S.data.projects || [], h = "";
    for (var i = 0; i < L.length; i++) { if (!activeOnly || L[i].active) { h += projectCard(L[i]); } }
    return h;
  }

  // ---------- (1.2) the House Wallet bill list, "I paid this" and the summary history ----------

  function kindWord(kind) {
    var key = "sk_" + String(kind || "").toLowerCase().split(" ").join("");
    return T.en[key] ? t(key) : tx(kind);
  }
  function findLedger(row) {
    var L = (S.data && S.data.ledger) || [];
    for (var i = 0; i < L.length; i++) { if (String(L[i].row) === String(row)) { return L[i]; } }
    return null;
  }
  // The owner may pay any bill at any time and tell us, so that it is not paid twice.
  function canMarkPaid(e) {
    return !!(S.data && S.data.owner.canPay && e && !e.isPaid && !e.cancelled && (e.bill || e.fromWallet) && e.amount !== undefined);
  }
  function billsNeedApproval() {
    var W = S.data && S.data.prop.wallet ? S.data.wallet : null;
    return !!(W && (W.bills || []).length && !(W.approval && W.approval.ok));
  }
  function billsCard() {
    var W = S.data.wallet;
    if (!W || !(W.bills || []).length) { return ""; }
    var a = W.approval || {};
    if (a.ok) {
      return "<div class='more'>" + esc(t("approvedOn", { who: a.by || "", t: stamp(a.when) })) + " · <button type='button' class='link' data-go='bills'>" + esc(t("billList")) + "</button></div>";
    }
    return "<div class='card'><div class='t'>" + esc(t(a.changed ? "approveChanged" : "approveNeed")) + "</div>" +
      "<button type='button' class='btn navy' data-go='bills'>" + esc(t("approveBills")) + "</button></div>";
  }
  function billLine(b) {
    var h = "<div class='kv'><b>" + esc(t("limitL")) + "</b><div>" + esc(money(b.nte, b.cur)) + "</div>";
    if (b.usual !== undefined) { h += "<b>" + esc(t("usualL")) + "</b><div>" + esc(money(b.usual, b.cur)) + "</div>"; }
    if (b.freq) { h += "<b>" + esc(t("everyL")) + "</b><div>" + esc(tx(b.freq)) + (b.dueDay ? ". " + esc(t("dueDayL", { d: b.dueDay })) : "") + "</div>"; }
    return h + "</div>";
  }

  // The list of bills LAS may pay, to read or to approve.
  function billsView() {
    var W = S.data.wallet;
    if (!W || !(W.bills || []).length) { S.view = "home"; return homeView(); }
    var a = W.approval || {}, canDo = !a.ok && S.data.owner.canPay, i, h = head(t("billList"), "");
    h += "<p class='hint' style='margin:10px 0 0'>" + esc(t("billListP")) + "</p>";
    if (a.ok) { h += "<div class='box good'>" + esc(t("approvedOn", { who: a.by || "", t: stamp(a.when) })) + "</div>"; }
    else { h += "<div class='box warn'>" + esc(t(a.changed ? "approveChanged" : "approveNeed")) + (canDo ? "" : "<br>" + esc(t("approveWho"))) + "</div>"; }
    for (i = 0; i < W.bills.length; i++) {
      var b = W.bills[i], pick = (S.draft["ov_" + b.row] || b.policy) === "pay" ? "pay" : "hold", dis = S.busy ? " disabled" : "";
      h += "<div class='card'><div class='t'>" + esc(tx(b.name)) + "</div>" + (b.payee ? "<div class='r'>" + esc(b.payee) + "</div>" : "") + billLine(b);
      if (canDo) {
        h += "<div class='kv'><b>" + esc(t("overQ")) + "</b></div>" +
          "<label class='tick' style='margin-top:8px'><input type='radio' name='ov_" + esc(b.row) + "' value='hold'" + (pick === "hold" ? " checked" : "") + dis + "><span>" + esc(t("holdOpt")) + "</span></label>" +
          "<label class='tick' style='margin-top:8px'><input type='radio' name='ov_" + esc(b.row) + "' value='pay'" + (pick === "pay" ? " checked" : "") + dis + "><span>" + esc(t("payOpt")) + "</span></label>";
      } else {
        h += "<div class='kv'><b>" + esc(t("overQ")) + "</b><div>" + esc(t(b.policy === "pay" ? "payOpt" : "holdOpt")) + "</div></div>";
      }
      h += "</div>";
    }
    h += "<p class='hint'>" + esc(t("approveNote")) + "</p>";
    if (canDo) { h += "<button type='button' class='btn navy' data-act='sendBills'" + (S.busy ? " disabled" : "") + ">" + esc(S.busy ? t("saving") : t("approveBtn")) + "</button>"; }
    return h + "</div>";
  }

  function captureBills() {
    var W = S.data && S.data.wallet, out = {};
    if (!W || S.view !== "bills") { return out; }
    for (var i = 0; i < (W.bills || []).length; i++) {
      var nodes = document.getElementsByName("ov_" + W.bills[i].row), v = "";
      for (var k = 0; k < nodes.length; k++) { if (nodes[k].checked) { v = nodes[k].value; } }
      if (v) { out[String(W.bills[i].row)] = v; S.draft["ov_" + W.bills[i].row] = v; }
    }
    return out;
  }

  function sendBills() {
    if (S.busy || !S.data.wallet) { return; }
    var choices = captureBills();
    if (!S.arg) { S.arg = {}; }
    if (!S.arg.rid) { S.arg.rid = newId(); }
    S.busy = true; S.msg = null; render();
    post({ op: "bills_approve", k: S.key, tok: S.tok, lang: S.lang, sig: S.data.wallet.sig || "", choices: choices, rid: S.arg.rid }, function (r) {
      S.busy = false;
      take(r);
      if (r.code === "SIGN_IN" || r.code === "NO_LINK" || r.code === "OFF") { stop(r.code); return; }
      if (r.ok && r.done) { S.draft = {}; S.flash = { key: "approveDone", kind: "good" }; stepBack(); return; }
      var map = { CHANGED: "bChanged", GONE: "bGone", NOT_ALLOWED: "pNotAllowed", NOT_READY: "NOT_READY" };
      S.arg.rid = ""; S.draft = {};
      S.msg = { key: map[r.code] || "SERVER", kind: "bad" }; render(); window.scrollTo(0, 0);
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }

  // "I paid this": the owner tells us a bill is paid, when, and from where.
  function paidView() {
    var e = findLedger(S.arg && S.arg.id);
    if (!e || !canMarkPaid(e)) { S.view = "home"; return homeView(); }
    var d = S.draft, today = String(S.info.now || "").substr(0, 10), dis = S.busy ? " disabled" : "";
    var h = head(t("iPaidT"), "");
    h += "<p style='margin:14px 0 6px'>" + esc(t("iPaidP")) + "</p>";
    h += "<div class='card'><div class='t'>" + esc(tx(e.desc)) + "</div>" + (e.payee ? "<div class='r'>" + esc(e.payee) + "</div>" : "") +
      "<div class='amt'>" + esc(money(e.amount, e.cur)) + "</div>" + (e.due ? "<div class='more'>" + esc(t("dueOn", { d: day(e.due) })) + "</div>" : "") + "</div>";
    h += "<label class='l' for='pdate'>" + esc(t("paidWhen")) + "</label><input class='f' id='pdate' type='date'" + (today ? " max='" + esc(today) + "'" : "") + " value='" + esc(d.pdate || today) + "'" + dis + ">";
    if (S.data.prop.wallet && S.data.wallet) {
      h += "<label class='l' for='pfrom'>" + esc(t("paidFrom")) + "</label><select class='f' id='pfrom'" + dis + ">" +
        "<option value='own'" + (d.pfrom === "wallet" ? "" : " selected") + ">" + esc(t("fromOwn")) + "</option>" +
        "<option value='wallet'" + (d.pfrom === "wallet" ? " selected" : "") + ">" + esc(t("fromWallet")) + "</option></select>";
    }
    h += "<label class='l' for='pproof'>" + esc(t("receiptL")) + "</label><div class='qh'>" + esc(t("receiptH")) + "</div>" +
      "<input class='f' id='pproof' type='url' inputmode='url' autocomplete='off' maxlength='400' value='" + esc(d.pproof || "") + "'" + dis + ">";
    h += "<label class='l' for='pnote'>" + esc(t("noteL")) + "</label><textarea id='pnote' maxlength='500'" + dis + ">" + esc(d.pnote || "") + "</textarea>";
    h += "<button type='button' class='btn navy' data-act='sendPaid'" + dis + ">" + esc(S.busy ? t("saving") : t("yes_paid")) + "</button>";
    h += "<button type='button' class='btn' data-act='back'" + dis + ">" + esc(t("goBack")) + "</button>";
    return h + "</div>";
  }

  function capturePaid() {
    if (S.view !== "paid") { return; }
    var ids = ["pdate", "pfrom", "pproof", "pnote"];
    for (var i = 0; i < ids.length; i++) { var n = el(ids[i]); if (n) { S.draft[ids[i]] = String(n.value || "").trim(); } }
  }

  function sendPaid() {
    if (S.busy || !S.arg) { return; }
    var e = findLedger(S.arg.id);
    if (!e) { go("home"); return; }
    capturePaid();
    if (!S.arg.rid) { S.arg.rid = newId(); }
    var d = S.draft;
    S.busy = true; S.msg = null; render();
    post({
      op: "owner_paid", k: S.key, tok: S.tok, lang: S.lang, row: e.row, amount: e.amount, cur: e.cur || "", desc: e.desc || "",
      date: d.pdate || "", from: d.pfrom === "wallet" ? "wallet" : "own", proof: d.pproof || "", note: d.pnote || "", rid: S.arg.rid
    }, function (r) {
      S.busy = false;
      take(r);
      if (r.code === "SIGN_IN" || r.code === "NO_LINK" || r.code === "OFF") { stop(r.code); return; }
      if (r.ok && r.done) { S.draft = {}; S.flash = { key: "paidDone", kind: "good" }; stepBack(); return; }
      var map = { CHANGED: "pChanged", GONE: "pGone", PAID_ALREADY: "pAlready", BAD_DATE: "pDate", BAD_LINK: "pLink", NO_CODES: "NO_CODES", NOT_ALLOWED: "pNotAllowed", NOT_READY: "NOT_READY" };
      S.arg.rid = "";
      var key = map[r.code] || "SERVER";
      // The bill itself changed or is gone: go back to the list, which now shows it as it is.

      h += "<p class='hint'>" + esc(t("inSendHint")) + "</p>" +
        "<button type='button' class='btn navy' data-act='sendIntake'" + (S.busy ? " disabled" : "") + ">" + esc(S.busy ? t("saving") : t("inSend")) + "</button>";
    }
    return h + "</div>";
  }

  function intakeSecView() {
    var I = S.data.intake, sec = findSection(S.arg && S.arg.id);
    if (!sec) { S.view = "intake"; return intakeView(); }
    var open = I.state === "open", h = head(qLabel(sec), "");
    if (qHint(sec)) { h += "<p class='hint' style='margin:10px 0 0'>" + esc(qHint(sec)) + "</p>"; }
    if (!open) {
      h += "<div class='kv'>";
      for (var k = 0; k < sec.q.length; k++) {
        var val = I.answers[sec.q[k].id] || "";
        h += "<b>" + esc(qLabel(sec.q[k])) + "</b><div>" + esc(val ? (sec.q[k].type === "choice" ? optionWord(sec.q[k], val) : (sec.q[k].type === "check" ? "✓" : val)) : t("noAnswer")) + "</div>";
      }
      return h + "</div></div>";
    }
    for (var i = 0; i < sec.q.length; i++) {
      var q = sec.q[i], id = "q_" + q.id;
      var v = S.draft[q.id] !== undefined ? S.draft[q.id] : (I.answers[q.id] || "");
      var bad = S.badFields.indexOf(q.id) !== -1 ? " bad" : "";
      var dis = S.busy ? " disabled" : "";
      if (q.type === "check") {
        h += "<label class='tick'><input type='checkbox' id='" + id + "'" + (v === "Yes" ? " checked" : "") + dis + "><span>" + esc(qLabel(q)) + "</span></label>";
        continue;
      }
      h += "<label class='l' for='" + id + "'>" + esc(qLabel(q)) + "</label>";
      if (qHint(q)) { h += "<div class='qh'>" + esc(qHint(q)) + "</div>"; }
      if (q.type === "choice") {
        h += "<select class='f' id='" + id + "'" + dis + "><option value=''>" + esc(t("choose")) + "</option>";
        for (var o = 0; o < q.options.length; o++) {
          h += "<option value='" + esc(q.options[o][0]) + "'" + (q.options[o][0] === v ? " selected" : "") + ">" + esc(S.lang === "es" ? q.options[o][1] : q.options[o][0]) + "</option>";
        }
        h += "</select>";
      } else if (q.type === "long") {
        h += "<textarea class='" + bad.trim() + "' id='" + id + "' maxlength='1500'" + dis + ">" + esc(v) + "</textarea>";
      } else {
        h += "<input class='f" + bad + "' id='" + id + "' type='text' maxlength='300' autocomplete='off' value='" + esc(v) + "'" + dis + ">";
      }
    }
    h += "<button type='button' class='btn navy' data-act='saveSection'" + (S.busy ? " disabled" : "") + ">" + esc(S.busy ? t("saving") : t("inSave")) + "</button>";
    return h + "</div>";
  }

  // What is typed in the section on screen, so it is not lost when the screen is redrawn.
  function captureForm() {
    if (S.view !== "intakeSec" || !S.data || !S.data.intake) { return {}; }
    var sec = findSection(S.arg && S.arg.id), out = {};
    if (!sec) { return out; }
    for (var i = 0; i < sec.q.length; i++) {
      var node = el("q_" + sec.q[i].id);
      if (!node) { continue; }
      var v = sec.q[i].type === "check" ? (node.checked ? "Yes" : "") : String(node.value || "").trim();
      S.draft[sec.q[i].id] = v;
      out[sec.q[i].id] = v;
    }
    return out;
  }

  // The section that holds the acknowledgment box.
  function ackSection() {
    var L = (S.data && S.data.intake && S.data.intake.sections) || [];
    for (var i = 0; i < L.length; i++) { for (var k = 0; k < L[i].q.length; k++) { if (L[i].q[k].id === "ack") { return L[i].id; } } }
    return L.length ? L[L.length - 1].id : "services";
  }

  function intakeAnswer(r, after) {
    S.busy = false;
    take(r);
    if (r.code === "SIGN_IN" || r.code === "NO_LINK" || r.code === "OFF") { stop(r.code); return; }
    if (!r.ok) {
      S.badFields = r.fields || [];
      S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad" };
      if (r.code === "NEED_ACK" && S.view !== "intakeSec") {
        var keepMsg = S.msg;
        go("intakeSec", { id: ackSection() });
        S.msg = keepMsg; render();
        return;
      }
      if (r.code === "INTAKE_CLOSED" && S.view === "intakeSec") { S.flash = S.msg; S.msg = null; stepBack(); return; }
      if (!r.view && !S.data) { stop(r.code); return; }
      render(); window.scrollTo(0, 0);
      return;
    }
    S.draft = {}; S.badFields = [];
    after();
  }

  function saveSection() {
    if (S.busy) { return; }
    var answers = captureForm();
    S.busy = true; S.msg = null; render();
    post({ op: "intake_save", k: S.key, tok: S.tok, lang: S.lang, answers: answers }, function (r) {
      intakeAnswer(r, function () { S.flash = { key: "inSaved", kind: "good" }; stepBack(); });
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }

  function sendIntake() {
    if (S.busy) { return; }
    S.busy = true; S.msg = null; render();
    post({ op: "intake_submit", k: S.key, tok: S.tok, lang: S.lang, answers: {} }, function (r) {
      intakeAnswer(r, function () { stepBack(); });
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }

  /* ---------- taps ---------- */

  function setLang() {
    captureForm(); capturePaid(); captureBills();
    S.lang = S.lang === "es" ? "en" : "es";
    setStore("lang", S.lang, true);
    render();
    if (S.tok && S.data) { load(true); }
    if (S.view === "pin") { focusPin(); }
  }

  document.addEventListener("click", function (ev) {
    var n = ev.target;
    while (n && n !== document.body && !(n.getAttribute && (n.getAttribute("data-go") || n.getAttribute("data-act") || n.getAttribute("data-choice")))) { n = n.parentNode; }
    if (!n || n === document.body || !n.getAttribute || n.disabled) { return; }
    var goTo = n.getAttribute("data-go"), act = n.getAttribute("data-act"), choice = n.getAttribute("data-choice"), arg = n.getAttribute("data-arg");
    if (goTo) { if (goTo === "help") { S.help = null; } go(goTo, arg ? { id: arg } : null); return; }
    if (choice) {
      if (S.view !== "decision") { try { window.history.pushState({ view: "decision", arg: { id: arg } }, "", window.location.pathname); } catch (e) {} }
      go("confirm", { id: arg, choice: choice });
      return;
    }
    if (act === "back") { stepBack(); return; }
    if (act === "help") { S.help = S.help === arg ? "" : arg; render(); showHelp(arg); return; }
    if (act === "signin") { signIn(); return; }
    if (act === "lang") { setLang(); return; }
    if (act === "retry") { if (S.msg && S.msg.retry) { S.msg.retry(); } return; }
    if (act === "refresh") { load(); return; }
    if (act === "send") { sendDecision(); return; }
    if (act === "sendPaid") { sendPaid(); return; }
    if (act === "sendBills") { sendBills(); return; }
    if (act === "saveSection") { saveSection(); return; }
    if (act === "sendIntake") { sendIntake(); return; }
    if (act === "signout") {
      dropStore("tok"); S.tok = ""; S.data = null; S.tr = null; S.done = null;
      if (S.key) { hello(); } else { S.view = "private"; render(); }
      return;
    }
  });
  el("lang").onclick = setLang;
  el("logoBar").src = LOGO;
  document.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "pin") {
      var n = S.info.pinLen || 6, raw = String(ev.target.value || "");
      if (raw.length === n && raw.replace(/[^0-9]/g, "") === raw) { signIn(); }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target && ev.target.id === "pin") { signIn(); }
  });
  // Coming back to a page that was left open: show the Portfolio as it is now.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || S.busy || !S.tok || !S.data) { return; }
    if (S.view !== "confirm" && S.view !== "intakeSec" && S.view !== "paid" && S.view !== "bills" && nowMs() - S.loadedAt > 60000) { load(true); }
  });

  function start() {
    var saved = getStore("lang");
    var nav = String(navigator.language || "").toLowerCase();
    S.lang = saved === "es" || saved === "en" ? saved : (nav.indexOf("es") === 0 ? "es" : "en");

    // The personal link carries the key after the # sign, so it is never sent to GitHub.
    // It is taken out of the address bar as soon as it has been read.
    var m = /[#&]k=([a-f0-9]{32})/.exec(String(window.location.hash || ""));
    var stored = getStore("k");
    if (m) {
      if (stored && stored !== m[1]) { dropStore("tok"); dropStore("k"); }
      S.key = m[1];
      setStore("k", S.key, false);
      try { window.history.replaceState({ view: "home" }, "", window.location.pathname); } catch (e) {}
    } else {
      S.key = stored;
    }
    S.tok = S.key ? getStore("tok") : "";
    if (!S.key) { S.view = "private"; render(); return; }
    if (S.tok) { load(); } else { hello(); }
  }

  start();
</script>
</body>
</html>
