<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2340">
<title>LAS Team</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.45; color: #0f2340; background: #ffffff; -webkit-text-size-adjust: 100%;
  }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; font-weight: 400; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #c9a227; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 600px; margin: 0 auto; }

  .bar { background: #0f2340; color: #ffffff; border-bottom: 3px solid #c9a227; position: sticky; top: 0; z-index: 5; }
  .bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
  .bar .who { font-size: 14px; line-height: 1.25; overflow: hidden; }
  .bar .who b { display: block; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: #e6c861; font-weight: 700; }
  .bar .right { display: flex; gap: 8px; align-items: center; flex: none; }
  .chip { font-size: 14px; font-weight: 600; background: transparent; color: #ffffff; border: 1.5px solid #ffffff; border-radius: 20px; padding: 6px 12px; min-height: 36px; }

  .center { text-align: center; padding: 40px 24px 56px; }
  .center img { width: 210px; max-width: 66%; height: auto; display: block; margin: 0 auto 22px; }
  .center h1 { font-size: 26px; margin: 0 0 8px; }
  .center p { font-size: 16px; color: #51606e; margin: 0 0 10px; }
  #gbtn { display: flex; justify-content: center; min-height: 48px; margin: 22px 0 10px; }

  .pad { padding: 14px 16px 48px; }
  .back { font-size: 15px; font-weight: 600; background: none; border: 0; padding: 12px 0 4px; display: inline-block; }
  h1.title { font-size: 26px; line-height: 1.15; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .sub { font-size: 14px; color: #51606e; margin: 0 0 6px; }
  .link { background: none; border: 0; padding: 9px 2px; font-size: inherit; text-decoration: underline; color: #0f2340; }
  .hint { font-size: 13.5px; color: #51606e; margin: 8px 0 0; }

  .pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 20px; padding: 4px 12px; font-size: 14px; font-weight: 700; border: 1.5px solid; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; display: inline-block; }
  .pill.s { color: #1c6b3c; } .pill.a { color: #8a5a00; background: #fff8e1; } .pill.r { color: #a8320a; background: #ffece4; }
  .tag { display: inline-block; font-size: 12.5px; font-weight: 700; border-radius: 12px; padding: 3px 10px; background: #eef1f5; color: #0f2340; margin: 0 6px 5px 0; }
  .tag.w { background: #fff1c9; color: #6b4e00; } .tag.g { background: #e3f3e6; color: #1c6b3c; } .tag.r { background: #ffe1d6; color: #7a1d00; }

  .card { display: block; width: 100%; text-align: left; border: 1.5px solid #c9a227; border-radius: 12px; padding: 13px 14px; margin-top: 10px; background: #ffffff; }
  .card .t { font-weight: 700; font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
  .card .r { font-size: 14px; color: #51606e; margin: 3px 0 8px; }
  .card.done { border-color: #d5dbe1; background: #f6f8fa; }
  .amt { font-size: 19px; font-weight: 700; }
  .bal { font-size: 24px; font-weight: 700; }

  .btn { display: block; width: 100%; text-align: center; border-radius: 10px; padding: 13px 12px; font-size: 16px; font-weight: 700; margin-top: 10px; min-height: 48px; border: 1.5px solid #0f2340; background: #ffffff; color: #0f2340; text-decoration: none; }
  .btn.navy { background: #0f2340; color: #ffffff; }
  .btn.gold { background: #c9a227; border-color: #c9a227; color: #0f2340; }
  .btn.small { display: inline-block; width: auto; min-height: 40px; padding: 8px 14px; font-size: 15px; margin: 8px 8px 0 0; }
  .btn:disabled { opacity: .55; }
  .two { display: flex; gap: 10px; } .two .btn { flex: 1; }

  .step { border: 1.5px solid #d5dbe1; border-radius: 12px; margin-top: 10px; overflow: hidden; }
  .step.open { border-color: #0f2340; }
  .step > button.sh { display: flex; width: 100%; align-items: center; gap: 12px; padding: 13px 14px; background: #ffffff; border: 0; text-align: left; min-height: 56px; }
  .step.open > button.sh { background: #eef1f5; }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #0f2340; color: #ffffff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .num.ok { background: #1c6b3c; }
  .sh .st { flex: 1; font-weight: 700; font-size: 17px; line-height: 1.25; }
  .sh .st small { display: block; font-weight: 400; font-size: 13px; color: #51606e; }
  .sh .n { flex: none; font-size: 13px; font-weight: 700; color: #6b4e00; background: #fff1c9; border-radius: 12px; padding: 2px 9px; }
  .body { padding: 4px 14px 16px; border-top: 1px solid #d5dbe1; }

  .item { border-bottom: 1px solid #d5dbe1; padding: 12px 0; }
  .item:last-child { border-bottom: 0; }
  .item .h { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .item .m { font-size: 13.5px; color: #51606e; margin: 3px 0 6px; overflow-wrap: anywhere; }
  .note { background: #eef1f5; border-left: 3px solid #c9a227; border-radius: 6px; padding: 8px 11px; font-size: 14.5px; margin-top: 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .note b { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: #51606e; display: block; font-weight: 700; }
  h2 { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; margin: 18px 0 4px; padding-bottom: 6px; border-bottom: 1.5px solid #c9a227; }
  .box { border-radius: 8px; padding: 11px 13px; font-size: 15px; margin-top: 12px; overflow-wrap: anywhere; }
  .box.good { background: #e3f3e6; border-left: 5px solid #1c6b3c; }
  .box.warn { background: #fff1c9; border-left: 5px solid #c9a227; }
  .box.bad { background: #ffe1d6; border-left: 5px solid #a8320a; color: #7a1d00; font-weight: 600; }
  .box.info { background: #eef1f5; border-left: 5px solid #0f2340; }
  .check { list-style: none; margin: 8px 0 0; padding: 0; }
  .check li { padding: 6px 0 6px 30px; position: relative; font-size: 15px; }
  .check li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #7d8a97; }
  .check li.y::before { background: #1c6b3c; border-color: #1c6b3c; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 4px; }
  table.t td { padding: 7px 4px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  table.t td.n { text-align: right; white-space: nowrap; }

  label.l { display: block; font-weight: 600; font-size: 15px; margin-top: 16px; }
  .f, textarea { width: 100%; padding: 11px; background: #ffffff; border: 2px solid #7d8a97; border-radius: 10px; margin-top: 6px; min-height: 48px; }
  textarea { min-height: 84px; resize: vertical; }
  .f.bad, textarea.bad { border-color: #a8320a; background: #fff6f2; }
  .qh { font-size: 13px; color: #51606e; margin-top: 4px; }
  .foot { margin-top: 28px; font-size: 13px; color: #51606e; text-align: center; }
  .empty { color: #51606e; font-size: 15px; padding: 8px 0 0; margin: 0; }
</style>
</head>

    if (n === null || n === undefined || n === "") { return ""; }
    var neg = n < 0, parts = Math.abs(Number(n)).toFixed(2).split("."), whole = parts[0], out = "";
    while (whole.length > 3) { out = "," + whole.slice(-3) + out; whole = whole.slice(0, -3); }
    return (cur ? cur + " " : "") + (neg ? "-" : "") + whole + out + "." + parts[1];
  }
  function href(u) { return /^https:[/][/]/.test(String(u || "")) ? String(u) : ""; }
  function newId() {
    var s = "", abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
    for (var i = 0; i < 20; i++) { s += abc.charAt(Math.floor(Math.random() * abc.length)); }
    return s;
  }
  function role() { return S.me ? S.me.role : ""; }

  /* ---------- talking to the Sheet ---------- */

  function post(body, onAnswer, onFail) {
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, 60000);
    var opts = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow" };
    if (ctrl) { opts.signal = ctrl.signal; }
    fetch(API, opts)
      .then(function (r) { return r.text(); })
      .then(function (text) {
        clearTimeout(timer);
        try { return JSON.parse(text); } catch (e) { return { ok: false, code: "SERVER" }; }
      }, function () { clearTimeout(timer); return null; })
      .then(function (j) { if (j === null) { onFail(); } else { onAnswer(j); } })
      .then(null, function (err) {
        try { console.error(err); } catch (e) {}
        S.busy = false; S.view = "error"; S.msg = { key: "SERVER", retry: start2 };
        try { render(); } catch (e2) {}
      });
  }

  // What every answer may carry: who is signed in, and the latest lists.
  function take(r) {
    if (r.me) { S.me = r.me; if (!recall("lang") && (r.me.lang === "es" || r.me.lang === "en")) { S.lang = r.me.lang; } }
    if (r.now) { S.now = r.now; }
    if (r.home) { S.home = r.home; }
    if (r.view) { S.data = r.view; S.code = r.view.prop.code; }
    if (r.queue) { S.queue = r.queue; }
    if (r.clientId !== undefined) { S.clientId = r.clientId; }
  }

  // An answer that says the sign-in is over sends the person back to the sign-in screen.
  function signedOut(r) {
    if (r.code !== "SIGN_IN") { return false; }
    forget("tok"); S.tok = ""; S.data = null; S.home = null; S.queue = null; S.busy = false;
    S.view = "signin"; S.msg = { key: "SIGN_AGAIN", kind: "warn" };
    render(); google1();
    return true;
  }

  function hello() {
    S.view = "loading"; S.msg = null; render();
    post({ op: "t_hello" }, function (r) {
      take(r);
      if (!r.ok || !S.clientId) { S.view = "error"; S.msg = { key: r.ok ? "NOT_SET_UP" : "SERVER", retry: hello }; render(); return; }
      S.view = "signin"; render(); google1();
    }, function () { S.view = "error"; S.msg = { key: "NET", retry: hello }; render(); });
  }

  /* ---------- Sign in with Google ---------- */

  function google1() {
    if (S.gReady) { drawGoogle(); return; }
    if (el("gsi")) { return; }
    var s = document.createElement("script");
    s.id = "gsi"; s.async = true; s.src = "https://accounts.google.com/gsi/client";
    s.onload = function () { S.gReady = true; drawGoogle(); };
    s.onerror = function () { S.gFail = true; try { s.parentNode.removeChild(s); } catch (e) {} if (S.view === "signin") { render(); } };
    document.head.appendChild(s);
  }
  function drawGoogle() {
    var host = el("gbtn");
    if (!host || !S.clientId || !window.google || !google.accounts || !google.accounts.id) { return; }
    try {
      google.accounts.id.initialize({ client_id: S.clientId, callback: onCredential, auto_select: true, cancel_on_tap_outside: false });
      host.innerHTML = "";
      google.accounts.id.renderButton(host, { theme: "filled_blue", size: "large", shape: "pill", text: "signin_with", locale: S.lang, width: 280 });
      google.accounts.id.prompt();
    } catch (e) { S.gFail = true; render(); }
  }
  function onCredential(resp) {
    if (!resp || !resp.credential || S.busy) { return; }
    S.busy = true; S.msg = null; render();
    post({ op: "t_signin", cred: resp.credential }, function (r) {
      S.busy = false;
      take(r);
      if (r.ok && r.tok) {
        S.tok = r.tok; remember("tok", r.tok);
        S.msg = null;
        afterSignIn();
        return;
      }
      try { google.accounts.id.disableAutoSelect(); } catch (e) {}
      S.view = "signin"; S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad" }; render(); drawGoogle();
    }, function () { S.busy = false; S.view = "signin"; S.msg = { key: "NET", kind: "bad" }; render(); drawGoogle(); });
  }
  function signOut() {
    forget("tok"); S.tok = ""; S.me = null; S.data = null; S.home = null; S.queue = null;
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    if (S.clientId) { S.view = "signin"; S.msg = null; render(); google1(); } else { hello(); }
  }

  // After signing in: the property the time clock sent the person to, when it is on their list. Otherwise the list.
  function afterSignIn() {
    var want = S.want; S.want = "";
    var L = (S.home && S.home.props) || [];
    for (var i = 0; i < L.length; i++) { if (want && L[i].code === want && !L[i].error) { openProp(want); return; } }
    S.view = "home"; render(); window.scrollTo(0, 0);
  }

  /* ---------- loading the lists ---------- */

  function loadHome(quiet) {
    if (quiet !== true) { S.view = "loading"; S.msg = null; render(); }
    post({ op: "t_home", tok: S.tok }, function (r) {
      if (signedOut(r)) { return; }
      take(r);
      if (!r.ok) { S.view = "error"; S.msg = { key: T.en[r.code] ? r.code : "SERVER", retry: loadHome }; render(); return; }
      if (quiet !== true) { afterSignIn(); } else if (S.view === "home") { render(); }
    }, function () { if (quiet === true) { return; } S.view = "error"; S.msg = { key: "NET", retry: loadHome }; render(); });
  }

  function openProp(code) {
    S.view = "loading"; S.msg = null; render();
    post({ op: "t_prop", tok: S.tok, p: code }, function (r) {
      if (signedOut(r)) { return; }
      take(r);
      if (!r.ok) { S.view = "home"; S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad", detail: r.detail || "" }; if (!S.home) { loadHome(); return; } render(); return; }
      S.open = firstOpen();
      go("prop");
    }, function () { S.view = "error"; S.msg = { key: "NET", retry: function () { openProp(code); } }; render(); });
  }
  // The first step of the day that has not been closed yet.
  function firstOpen() {
    var D = S.data, L = D.steps || [];
    for (var i = 0; i < L.length; i++) { if (!(D.done || {})[L[i]]) { return L[i]; } }
    return "";
  }

  function loadQueue() {
    S.view = "loading"; S.msg = null; render();
    post({ op: "t_queue", tok: S.tok }, function (r) {
      if (signedOut(r)) { return; }
      take(r);
      if (!r.ok) { S.view = "home"; S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad" }; render(); return; }
      go("queue");
    }, function () { S.view = "error"; S.msg = { key: "NET", retry: loadQueue }; render(); });
  }

  /* ---------- moving between screens ---------- */

  function go(view, keep) {
    S.view = view;
    if (keep !== true) { S.msg = S.flash || null; S.flash = null; }
    try { window.history.pushState({ view: view }, "", window.location.pathname); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", function (ev) {
    if (!S.tok || !S.me) { return; }
    var v = (ev.state && ev.state.view) || "home";
    if ((v === "prop" || v === "form") && !S.data) { v = "home"; }
    if (v === "form") { v = "prop"; }
    if (v === "queue" && !S.queue) { v = "home"; }
    S.view = v; S.form = null; S.msg = S.flash || null; S.flash = null;
    render(); window.scrollTo(0, 0);
    if (v === "home") { loadHome(true); }
  });
  function stepBack() { try { window.history.back(); } catch (e) { S.view = "home"; render(); } }

  /* ---------- drawing ---------- */

  function render() {
    document.documentElement.lang = S.lang;
    el("lang").textContent = t("other");
    el("out").textContent = t("signOut");
    var bare = S.view === "loading" || S.view === "error" || S.view === "signin";
    el("bar").hidden = bare || !S.me;
    el("whoName").textContent = S.me ? S.me.name : "";
    var h = "";
    if (S.view === "loading") { h = centered("", "<p>" + esc(t("loading")) + "</p>"); }
    else if (S.view === "error") { h = centered("", "<p>" + esc(t(S.msg.key)) + "</p><button type='button' class='btn navy' data-act='retry'>" + esc(t("retry")) + "</button>"); }
    else if (S.view === "signin") { h = signinView(); }
    else if (S.view === "queue" && S.queue) { h = queueView(); }
    else if (S.view === "form" && S.form && S.data) { h = formView(); }
    else if (S.view === "prop" && S.data) { h = propView(); }
    else { S.view = "home"; h = homeView(); }
    el("app").innerHTML = h;
    document.title = (S.view === "prop" && S.data ? S.data.prop.name + " - " : "") + t("title");
    if (S.view === "signin") { var g = el("gbtn"); if (g && S.gReady && !g.firstChild) { drawGoogle(); } }
  }

  function centered(title, inner) {
    return "<div class='wrap center'><img src='" + LOGO + "' alt='Liaison Asset Services'>" + (title ? "<h1 class='serif'>" + esc(title) + "</h1>" : "") + inner + "</div>";
  }
  function msgBox() {
    if (!S.msg) { return ""; }
    var text = S.msg.text || t(S.msg.key, S.msg.vars);
    return "<div class='box " + (S.msg.kind || "bad") + "' role='alert'>" + esc(text) + (S.msg.detail ? "<br><span style='font-weight:400'>" + esc(S.msg.detail) + "</span>" : "") +
      (S.msg.lines ? "<br>" + S.msg.lines.map(esc).join("<br>") : "") + "</div>";
  }

  function signinView() {
    return "<div class='wrap center'><img src='" + LOGO + "' alt='Liaison Asset Services'><h1 class='serif'>" + esc(t("title")) + "</h1><p>" + esc(t("signP")) + "</p>" +
      msgBox() + (S.busy ? "<p>" + esc(t("loading")) + "</p>" : "") + "<div id='gbtn'" + (S.busy ? " hidden" : "") + "></div>" +
      (S.gFail && !S.busy ? "<div class='box warn'>" + esc(t("gFail")) + "</div><button type='button' class='btn navy' data-act='gretry'>" + esc(t("retry")) + "</button>" : "") +
      "<p class='hint'>" + esc(t("signHint")) + "</p>" +
      "<p style='margin-top:22px'><button type='button' class='link' data-act='lang'>" + esc(t("other")) + "</button></p></div>";
  }

  function pill(status) {
    var s = String(status || "");
    if (!s) { return ""; }
    var cls = "s", key = "st_Stable";
    if (s === "Attention") { cls = "a"; key = "st_Attention"; }
    else if (s === "Immediate Action") { cls = "r"; key = "st_Immediate"; }
    else if (s !== "Stable") { return "<span class='pill a'><i></i>" + esc(s) + "</span>"; }
    return "<span class='pill " + cls + "'><i></i>" + esc(t(key)) + "</span>";
  }
  function tag(text, cls) { return "<span class='tag " + (cls || "") + "'>" + esc(text) + "</span>"; }
  function note(label, text) { return text ? "<div class='note'><b>" + esc(label) + "</b>" + esc(text) + "</div>" : ""; }

  /* ---------- the list of properties ---------- */

  function homeView() {
    var H = S.home || { props: [] }, h = "<div class='wrap pad'>";
    h += "<h1 class='title serif'>" + esc(t("myDay")) + "</h1><p class='sub'>" + esc(t("today")) + (H.today ? ": " + esc(day(H.today)) : "") +
      " · <button type='button' class='link' data-act='refresh'>" + esc(t("refresh")) + "</button></p>" + msgBox();
    if (H.waiting) { h += "<button type='button' class='btn gold' data-act='queue'>" + esc(t(role() === "Principal" ? "waitingBtn" : "waitingMine")) + " (" + H.waiting + ")</button>"; }
    else if (role() !== "Field") { h += "<p class='hint'><button type='button' class='link' data-act='queue'>" + esc(t(role() === "Principal" ? "waitingBtn" : "waitingMine")) + "</button></p>"; }
    if (!H.props.length) { h += "<p class='empty'>" + esc(t("noProps")) + "</p>"; }
    for (var i = 0; i < H.props.length; i++) { h += propCard(H.props[i]); }
    return h + "</div>";
  }

  function propCard(c) {
    var tags = "";
    if (c.error) { tags += tag(t("c_error"), "r"); }
    if (c.mode === "hold") { tags += tag(t("c_hold"), "w"); }
    if (c.mode === "residence") { tags += tag(t("c_residence"), "w"); }
    if (c.wallet && !c.wallet.ready) { tags += tag(t("c_setup"), "w"); }
    if (c.over) { tags += tag(t("c_over", { n: c.over }), "r"); }
    if (c.bills) { tags += tag(t("c_bills", { n: c.bills }), "w"); }
    if (c.wallet && c.wallet.missing) { tags += tag(t("c_missing", { n: c.wallet.missing }), "w"); }
    if (c.wallet && c.wallet.low) { tags += tag(t("c_low"), "r"); }
    if (c.waiting) { tags += tag(t("c_decisions", { n: c.waiting }), "w"); }
    if (c.summaryDue) { tags += tag(t("c_summary"), "w"); }
    if (c.remind) { tags += tag(t("c_remind"), "w"); }
    if (c.open) { tags += tag(t("c_open", { n: c.open })); }
    if (c.stale) { tags += tag(t("c_stale", { n: c.stale }), "w"); }
    if (c.fix) { tags += tag(t("c_fix", { n: c.fix })); }
    if (c.closed) { tags += tag(t("c_closed"), "g"); } else if (c.steps) { tags += tag(t("c_steps", { n: c.steps }), "g"); }
    return "<button type='button' class='card" + (c.closed ? " done" : "") + "' data-prop='" + esc(c.code) + "'" + (c.error ? " disabled" : "") + ">" +
      "<div class='t'>" + esc(c.name) + "</div><div class='r'>" + esc([c.code, c.level].filter(Boolean).join(" · ")) + "</div>" +
      (c.status ? "<div style='margin-bottom:8px'>" + pill(c.status) + "</div>" : "") + tags + "</button>";
  }

  /* ---------- one property: the steps of the day ---------- */

  function propView() {
    var D = S.data, h = "<div class='wrap pad'><button type='button' class='back' data-act='home'>‹ " + esc(t("myDay")) + "</button>";
    h += "<h1 class='title serif'>" + esc(D.prop.name) + "</h1><p class='sub'>" + esc([D.prop.code, D.prop.level, D.prop.loc].filter(Boolean).join(" · ")) + "</p>";
    h += "<div>" + pill(D.status) + (D.prop.mode === "hold" ? " " + tag(t("c_hold"), "w") : "") + (D.prop.mode === "residence" ? " " + tag(t("c_residence"), "w") : "") + "</div>";
    if (D.minutes) { h += "<p class='hint'>" + esc(t(D.minutes.used > D.minutes.allow ? "minutesOver" : "minutes", { u: D.minutes.used, a: D.minutes.allow })) + "</p>"; }
    h += msgBox();
    if ((D.queue || []).length) {
      h += "<div class='box info'><b>" + esc(t("qWaiting")) + " (" + D.queue.length + ")</b>";
      for (var q = 0; q < D.queue.length; q++) { h += "<br>" + esc(D.queue[q].what) + " <span class='sub'>(" + esc(t("qBy", { who: D.queue[q].by, t: day(D.queue[q].when) })) + ")</span>"; }
      h += "</div>";
    }
    var L = D.steps || [];
    for (var i = 0; i < L.length; i++) { h += stepBlock(L[i], i + 1); }
    return h + "</div>";
  }

  function stepCount(step) {
    var D = S.data, n = 0, i;
    if (step === "came") { n = ((D.came.calls || []).length) + ((D.came.clock && D.came.clock.noshow) || []).length + ((D.came.clock && D.came.clock.review) || []).length; }
    if (step === "bank" && D.wallet) { n = D.wallet.ready ? ((D.wallet.bankAsk ? 1 : 0) + (D.wallet.low || []).length + (remindOf("statement") ? 1 : 0)) : 1; }
    if (step === "bills") { n = (D.bills || []).length + ((D.wallet && D.wallet.missing) || []).length; }
    if (step === "repairs") { n = (D.items || []).length; }
    if (step === "coming") { n = (D.coming || []).length; }
    if (step === "fix") { n = (D.fix || []).length + (D.held || []).length; }
    if (step === "summary") { n = (D.summary && D.summary.due ? 1 : 0) + (remindOf("review") ? 1 : 0); }
    return n;
  }

  function stepBlock(step, num) {
    var D = S.data, done = (D.done || {})[step], open = S.open === step, n = stepCount(step);
    var sub = done ? t(done.result === "Nothing today" ? "nothingBy" : "doneBy", { who: done.by }) : t("h_" + step);
    var h = "<div class='step" + (open ? " open" : "") + "' id='step_" + step + "'><button type='button' class='sh' data-step='" + step + "' aria-expanded='" + (open ? "true" : "false") + "'>" +
      "<span class='num" + (done ? " ok" : "") + "'>" + (done ? "✓" : num) + "</span><span class='st'>" + esc(t("s_" + step)) + "<small>" + esc(sub) + "</small></span>" +
      (n && !done ? "<span class='n'>" + n + "</span>" : "") + "</button>";
    if (!open) { return h + "</div>"; }
    h += "<div class='body'>";
    if (step === "came") { h += cameBody(); }
    else if (step === "bank") { h += bankBody(); }
    else if (step === "bills") { h += billsBody(); }
    else if (step === "repairs") { h += repairsBody(); }
    else if (step === "coming") { h += comingBody(); }
    else if (step === "fix") { h += fixBody(); }
    else if (step === "summary") { h += summaryBody(); }
    else if (step === "close") { h += closeBody(done); }
    if (step !== "close") {
      var dis = S.busy ? " disabled" : "";
      h += "<div class='two'><button type='button' class='btn navy' data-done='" + step + "'" + dis + ">" + esc(t("markDone")) + "</button>" +
        "<button type='button' class='btn' data-nothing='" + step + "'" + dis + ">" + esc(t("markNothing")) + "</button></div>";
    }
    return h + "</div></div>";
  }

  function cameBody() {
    var D = S.data, C = D.came, i, h = "";
    if (C.handoff) { h += note(t("handoff", { who: C.handoff.by, d: day(C.handoff.day) }), C.handoff.note); }
    h += "<div class='box info'>" + esc(t("msgRemind")) + "</div>";
    if ((C.calls || []).length) {
      h += "<h2>" + esc(t("calls")) + "</h2>";
      for (i = 0; i < C.calls.length; i++) { h += "<div class='item'><div class='h'>" + esc(C.calls[i].issue) + "</div><div class='m'>" + esc(C.calls[i].id + " · " + day(C.calls[i].called)) + "</div></div>"; }
    }
    if (C.answers) {
      h += "<h2>" + esc(t("answers")) + "</h2>";
      if (!C.answers.length) { h += "<p class='empty'>" + esc(t("noAnswers")) + "</p>"; }
      for (i = 0; i < C.answers.length; i++) {
        var a = C.answers[i];
        h += "<div class='item'><div class='h'>" + esc(tx(a.chose)) + ": " + esc(a.issue) + "</div><div class='m'>" + esc([a.by, day(a.when), a.id].filter(Boolean).join(" · ")) + "</div>" + (a.note ? note(t("l_note"), a.note) : "") + "</div>";
      }
    }
    var K = C.clock || {};
    if (K.ok === false) { if (K.why) { h += "<div class='box warn'>" + esc(t("clockOff")) + " " + esc(K.why) + "</div>"; } return h; }
    for (i = 0; i < (K.noshow || []).length; i++) { h += "<div class='box warn'><b>" + esc(t("noshow")) + "</b><br>" + esc(t("noshowP", { name: K.noshow[i].name, days: K.noshow[i].days })) + "</div>"; }
    h += "<h2>" + esc(t("onClock")) + "</h2>";
    if (!(K.on || []).length) { h += "<p class='empty'>" + esc(t("nobodyOn")) + "</p>"; }
    for (i = 0; i < (K.on || []).length; i++) {
      h += "<div class='item'><div class='h'>" + esc(K.on[i].name) + "</div><div class='m'>" + esc([K.on[i].type, K.on[i].desk ? t("desk") : "", K.on[i].at ? t("since", { t: clock(K.on[i].at) }) : ""].filter(Boolean).join(" · ")) + "</div></div>";
    }
    if ((K.review || []).length) {
      h += "<h2>" + esc(t("review")) + "</h2>";
      for (i = 0; i < K.review.length; i++) { h += "<div class='item'><div class='h'>" + esc(K.review[i].name) + "</div><div class='m'>" + esc(day(K.review[i].day) + " · " + K.review[i].what) + "</div></div>"; }
    }
    return h;
  }

  function bankBody() {
    var W = S.data.wallet, i, h = "";
    if (!W.ready) {
      var u = W.setup || {};
      h += "<h2>" + esc(t("setupT")) + "</h2><ul class='check'>" +
        "<li class='" + (u.active ? "y" : "") + "'>" + esc(t("setup1")) + "</li>" +
        "<li class='" + (u.bills ? "y" : "") + "'>" + esc(t("setup2", { n: u.bills || 0 })) + "</li>" +
        "<li class='" + (u.approved ? "y" : "") + "'>" + esc(t(W.approval && W.approval.changed ? "setup3c" : "setup3")) + "</li>" +
        "<li class='" + (u.bank ? "y" : "") + "'>" + esc(t("setup4")) + "</li></ul><p class='hint'>" + esc(t("setupP")) + "</p>";
      if (role() === "Principal" && !u.bank) { h += "<button type='button' class='btn' data-form='bank'>" + esc(t("bBank")) + "</button>"; }
      return h;
    }
    var bankBy = {};
    for (i = 0; i < (W.bank || []).length; i++) { bankBy[W.bank[i].cur] = W.bank[i]; }
    for (i = 0; i < (W.byCur || []).length; i++) {

    if (f.kind === "bank") { data.balance = (String(v.balance || "").indexOf("-") === 0 ? "-" : "") + amountOf(v.balance); }
    if (f.kind === "deposit") { data.amount = amountOf(v.amount); if (data.amount !== "" && v.dir === "out") { data.amount = "-" + data.amount; } delete data.dir; }
    if (f.kind === "bill") { data.amount = amountOf(v.amount); if (again === true) { data.again = true; } }
    if (f.kind === "decision") { data.amount = amountOf(v.amount); }
    if (f.kind === "paid") {
      var b = findBy(D.bills, f.init.row) || {};
      data.row = b.row; data.amount = b.amount; data.cur = b.cur; data.desc = b.desc;
      data.by = v.by === "las" ? "LAS" : "Owner"; data.from = v.by === "own" ? "owner" : "wallet";
      data.wAmount = amountOf(v.wAmount);
    }
    if (f.kind === "act_update") { var a = findBy(D.items, f.init.row) || {}; data.row = a.row; data.summary = a.summary; }
    if (!f.rid) { f.rid = newId(); }
    S.busy = true; S.msg = null; f.bad = ""; render();
    post({ op: "t_do", tok: S.tok, p: S.code, kind: f.kind, data: data, rid: f.rid }, function (r) {
      S.busy = false;
      if (signedOut(r)) { return; }
      take(r);
      if (r.ok && r.done) {
        S.flash = doneMessage(r.done);
        S.form = null;
        stepBack();
        return;
      }
      f.rid = ""; f.again = r.code === "DUP_BILL";
      f.bad = r.field || "";
      S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad", detail: r.code === "NOT_READY" ? (r.detail || "") : "" };
      render(); window.scrollTo(0, 0);
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }

  function doneMessage(done) {
    if (done.queued) { return { key: "queued", kind: "info", lines: [done.what] }; }
    var lines = [], warn = false, notes = done.notes || [];
    if (done.what) { lines.push(done.what); }
    for (var i = 0; i < notes.length; i++) {
      var parts = String(notes[i]).split(":"), key = "n_" + parts[0], x = parts.slice(1).join(":");
      if (T.en[key]) { lines.push(t(key, { x: x })); }
      if (parts[0] !== "MATCH" && parts[0] !== "WHY_ITEM" && parts[0] !== "DECISION") { warn = true; }
    }
    return { key: "saved", kind: warn ? "warn" : "good", lines: lines };
  }

  function sendStep(step, nothing) {
    if (S.busy) { return; }
    var noteText = "";
    var extra = step === "review" || step === "statement", openNow = S.open;
    if (step === "close") { var n = el("closeNote"); noteText = n ? String(n.value || "").trim() : ""; }
    S.busy = true; S.msg = null; render();
    post({ op: "t_step", tok: S.tok, p: S.code, step: step, result: nothing ? "nothing" : "done", note: noteText, rid: newId() }, function (r) {
      S.busy = false;
      if (signedOut(r)) { return; }
      take(r);
      if (!r.ok) { S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad" }; render(); return; }
      // A weekly or monthly check leaves the day where it was.
      if (extra) { S.open = openNow; render(); return; }
      // On to the next step that is still open.
      var L = S.data.steps || [], at = L.indexOf(step);
      S.open = "";
      for (var i = at + 1; i < L.length; i++) { if (!(S.data.done || {})[L[i]]) { S.open = L[i]; break; } }
      render();
      var node = S.open ? el("step_" + S.open) : null;
      if (node && node.scrollIntoView) { node.scrollIntoView({ block: "start" }); }
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }

  /* ---------- the review queue ---------- */

  function queueView() {
    var Q = S.queue, i, h = "<div class='wrap pad'><button type='button' class='back' data-act='home'>‹ " + esc(t("myDay")) + "</button><h1 class='title serif'>" + esc(t("queueT")) + "</h1>" + msgBox();
    if (!Q.waiting.length) { h += "<p class='empty'>" + esc(t("queueNone")) + "</p>"; }
    for (i = 0; i < Q.waiting.length; i++) {
      var q = Q.waiting[i], dis = S.busy ? " disabled" : "";
      h += "<div class='card' id='q_" + esc(q.id) + "'><div class='r' style='margin:0 0 4px'>" + esc([q.pname, t("k_" + q.kind), t("qBy", { who: q.by, t: day(q.when) })].join(" · ")) + "</div>";
      if (q.kind === "summary" && q.data && Q.canApprove) {
        h += "<p class='hint' style='margin:0'>" + esc(t("editS")) + "</p><div>" + tag(tx(q.data.kind)) + pill(q.data.status) + "</div>";
        var blocks = [["happened", "b_happened"], ["did", "b_did"], ["attention", "b_attention"], ["need", "b_need"]];
        for (var b = 0; b < blocks.length; b++) {
          h += "<label class='l' for='qs_" + esc(q.id) + "_" + blocks[b][0] + "'>" + esc(t(blocks[b][1])) + "</label><textarea id='qs_" + esc(q.id) + "_" + blocks[b][0] + "' maxlength='1200'" + dis + ">" + esc(q.data[blocks[b][0]] || "") + "</textarea>";
        }
      } else { h += "<div class='t' style='font-size:16px'>" + esc(q.what) + "</div>"; }
      if (Q.canApprove) {
        h += "<button type='button' class='btn navy' data-approve='" + esc(q.id) + "'" + dis + ">" + esc(t("approve")) + "</button>" +
          "<label class='l' for='qn_" + esc(q.id) + "'>" + esc(t("retL")) + "</label><input class='f' id='qn_" + esc(q.id) + "' type='text' maxlength='500' autocomplete='off'" + dis + ">" +
          "<button type='button' class='btn' data-return='" + esc(q.id) + "'" + dis + ">" + esc(t("ret")) + "</button>";
      }
      h += "</div>";
    }
    if (Q.recent.length) {
      h += "<h2>" + esc(t("recent")) + "</h2>";
      for (i = 0; i < Q.recent.length; i++) {
        var r = Q.recent[i];
        h += "<div class='item'><div class='h' style='font-size:15px'>" + esc(r.what) + "</div><div class='m'>" + esc([r.pname, t("k_" + r.kind), r.by].join(" · ")) + "</div>" +
          tag(t("q_" + r.status) + (r.revBy ? ": " + r.revBy : ""), r.status === "Approved" ? "g" : "r") + (r.note ? note(t("retL"), r.note) : "") + "</div>";
      }
    }
    return h + "</div>";
  }

  function sendReview(id, action) {
    if (S.busy) { return; }
    var body = { op: "t_review", tok: S.tok, qid: id, action: action, rid: newId() }, q = null, i;
    for (i = 0; i < S.queue.waiting.length; i++) { if (S.queue.waiting[i].id === id) { q = S.queue.waiting[i]; } }
    var n = el("qn_" + id);
    body.note = n ? String(n.value || "").trim() : "";
    if (action === "approve" && q && q.kind === "summary" && q.data) {
      var data = { kind: q.data.kind, status: q.data.status }, keys = ["happened", "did", "attention", "need"];
      for (i = 0; i < keys.length; i++) { var a = el("qs_" + id + "_" + keys[i]); data[keys[i]] = a ? String(a.value || "").trim() : (q.data[keys[i]] || ""); }
      body.data = data;
    }
    S.busy = true; S.msg = null; render();
    post(body, function (r) {
      S.busy = false;
      if (signedOut(r)) { return; }
      take(r);
      if (r.ok && r.done) {
        S.msg = r.done.already ? { key: "already", kind: "warn" } : { key: action === "approve" ? "approved" : "returned", kind: "good", lines: [r.done.what].concat(noteLines(r.done.notes)) };
        if (S.home && S.home.waiting) { S.home.waiting = S.queue.waiting.length; }
      } else {
        S.msg = { key: T.en[r.code] ? r.code : "SERVER", kind: "bad", detail: r.detail || "" };
      }
      render(); window.scrollTo(0, 0);
    }, function () { S.busy = false; S.msg = { key: "NET", kind: "bad" }; render(); });
  }
  function noteLines(notes) {
    var out = [];
    for (var i = 0; i < (notes || []).length; i++) { var parts = String(notes[i]).split(":"), key = "n_" + parts[0]; if (T.en[key]) { out.push(t(key, { x: parts.slice(1).join(":") })); } }
    return out;
  }

  /* ---------- taps ---------- */

  function setLang() {
    capture();
    S.lang = S.lang === "es" ? "en" : "es";
    remember("lang", S.lang);
    render();
    if (S.view === "signin") { drawGoogle(); }
  }

  document.addEventListener("click", function (ev) {
    var n = ev.target, names = ["data-act", "data-prop", "data-step", "data-form", "data-done", "data-nothing", "data-approve", "data-return"];
    var hit = function (node) { for (var i = 0; i < names.length; i++) { if (node.getAttribute(names[i]) !== null) { return names[i]; } } return ""; };
    while (n && n !== document.body && !(n.getAttribute && hit(n))) { n = n.parentNode; }
    if (!n || n === document.body || !n.getAttribute || n.disabled) { return; }
    var which = hit(n), val = n.getAttribute(which), arg = n.getAttribute("data-arg");
    if (which === "data-prop") { openProp(val); return; }
    if (which === "data-step") { S.open = S.open === val ? "" : val; S.msg = null; render(); return; }
    if (which === "data-form") { openForm(val, arg); return; }
    if (which === "data-done") { sendStep(val, false); return; }
    if (which === "data-nothing") { sendStep(val, true); return; }
    if (which === "data-approve") { sendReview(val, "approve"); return; }
    if (which === "data-return") { sendReview(val, "return"); return; }
    if (val === "back") { stepBack(); return; }
    if (val === "home") { S.form = null; S.msg = null; go("home"); loadHome(true); return; }
    if (val === "lang") { setLang(); return; }
    if (val === "retry") { if (S.msg && S.msg.retry) { S.msg.retry(); } return; }
    if (val === "gretry") { S.gFail = false; render(); google1(); return; }
    if (val === "refresh") { loadHome(); return; }
    if (val === "queue") { loadQueue(); return; }
    if (val === "submit") { submitForm(false); return; }
    if (val === "again") { submitForm(true); return; }
  });
  // A choice that changes which boxes the form shows.
  document.addEventListener("change", function (ev) {
    if (ev.target && ev.target.getAttribute && ev.target.getAttribute("data-redraw")) { capture(); render(); }
  });
  el("lang").onclick = setLang;
  el("out").onclick = signOut;
  // Coming back to a list that was left open: show it as it is now.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && S.tok && S.view === "home" && !S.busy) { loadHome(true); }
  });

  function start2() {
    if (S.tok) { loadHome(); } else { hello(); }
  }

  function start() {
    var saved = recall("lang");
    var nav = String(navigator.language || "").toLowerCase();
    S.lang = saved === "es" || saved === "en" ? saved : (nav.indexOf("es") === 0 ? "es" : "en");
    // The time clock sends the person here with the property they clocked in to: #p=CDH
    var m = /[#&]p=([A-Za-z0-9]{2,6})/.exec(String(window.location.hash || ""));
    S.want = m ? m[1].toUpperCase() : "";
    try { window.history.replaceState({ view: "home" }, "", window.location.pathname); } catch (e) {}
    S.tok = recall("tok");
    // The client ID is needed whenever the sign-in screen has to be shown, so it is asked for at the start.
    post({ op: "t_hello" }, function (r) {
      take(r);
      if (S.tok) { loadHome(); return; }
      if (!r.ok || !S.clientId) { S.view = "error"; S.msg = { key: r.ok ? "NOT_SET_UP" : "SERVER", retry: hello }; render(); return; }
      S.view = "signin"; render(); google1();
    }, function () { S.view = "error"; S.msg = { key: "NET", retry: start2 }; render(); });
    render();
  }

  start();
</script>
</body>
</html>
